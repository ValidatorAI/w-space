services:
  hermes:
    image: nousresearch/hermes-agent:stable
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    ports:
      - "8642:8642"
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${HERMES_API_KEY:-replace-me}"
      API_SERVER_CORS_ORIGINS: "*"
    volumes:
      - hermes-data:/opt/data

  app:
    image: pwrwork/space:latest
    container_name: pwr-space
    depends_on:
      - hermes
    env_file:
      - .env
    environment:
      RAILS_ENV: production
      PORT: "3000"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:-replace-me}"
      HERMES_BASE_URI: http://hermes:8642
      HERMES_API_KEY: "${HERMES_API_KEY:-replace-me}"
      HERMES_MODEL: "${HERMES_MODEL:-hermes}"
      HERMES_DEFAULT_PROFILE: "${HERMES_DEFAULT_PROFILE:-delegator}"
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:-replace-me}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  hermes-data:
